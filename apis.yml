apis:
- aid: moneyhub:moneyhub-data-api
  name: Moneyhub Data & Intelligence API
  description: >-
    The Moneyhub Data API (v2.0) is a RESTful, JSON, bearer-token API for Open
    Banking account aggregation and financial intelligence: connect accounts,
    read balances, holdings, standing orders, statements and enriched
    transactions, and run categorisation, affordability, spending analysis,
    savings goals and standard financial statements. Published as a Swagger 2.0
    definition served from the live API host.
  humanURL: https://docs.moneyhubenterprise.com/reference
  baseURL: https://api.moneyhub.co.uk/v2.0
  tags:
  - Data Aggregation
  - Open Banking
  - Enrichment
  - Affordability
  - AISP
  properties:
  - type: OpenAPI
    url: openapi/moneyhub-data-api-swagger.json
  - type: Documentation
    url: https://docs.moneyhubenterprise.com/docs/introduction
  - type: APIReference
    url: https://moneyhub.github.io/api-docs/
  - type: GettingStarted
    url: https://docs.moneyhubenterprise.com/docs/getting-started
  - type: Documentation
    url: https://www.moneyhub.com/apis/data-intelligence
- aid: moneyhub:moneyhub-open-banking-payments-api
  name: Moneyhub Open Banking Payments API
  description: >-
    Moneyhub's Open Banking Payments API initiates account-to-account payments
    (Payment Initiation Service) over the UK Faster Payments rails as a cheaper,
    near-instant alternative to cards, direct debits and standing orders.
    Payments, standing orders, recurring and reverse payments are authorised
    through Moneyhub's OpenID Connect / OAuth2 identity layer using dedicated
    payment scopes (mh:payment, mh:standing_order, mh:recurring_payment,
    mh:reverse_payment); the flow is documented but no standalone downloadable
    OpenAPI is published for the payment-initiation surface.
  humanURL: https://www.moneyhub.com/apis/open-banking-payments
  baseURL: https://identity.moneyhub.co.uk/oidc
  tags:
  - Payments
  - Payment Initiation
  - Account-to-Account
  - Faster Payments
  - PISP
  properties:
  - type: Documentation
    url: https://www.moneyhub.com/apis/open-banking-payments
  - type: Documentation
    url: https://www.moneyhub.com/payments-open-payment-api
  - type: APIReference
    url: https://moneyhub.github.io/api-docs/
  - type: Authentication
    url: https://identity.moneyhub.co.uk/oidc/.well-known/openid-configuration
