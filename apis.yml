apis:
- aid: moneyhub:moneyhub-open-banking-payments-api
  name: Moneyhub Open Banking Payments API
  description: >-
    Moneyhub's Open Banking Payments API initiates account-to-account payments (Payment Initiation Service)
    over the UK Faster Payments rails as a cheaper, near-instant alternative to cards, direct debits and
    standing orders. Payments, standing orders, recurring and reverse payments are authorised through
    Moneyhub's OpenID Connect / OAuth2 identity layer using dedicated payment scopes (mh:payment, mh:standing_order,
    mh:recurring_payment, mh:reverse_payment); the flow is documented but no standalone downloadable OpenAPI
    is published for the payment-initiation surface.
  humanURL: https://www.moneyhub.com/apis/open-banking-payments
  baseURL: https://identity.moneyhub.co.uk/oidc
  tags:
  - Payments
  - Payment Initiation
  - Account-to-Account
  - Faster Payments
  - PISP
