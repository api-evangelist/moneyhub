aid: moneyhub
url: https://raw.githubusercontent.com/api-evangelist/moneyhub/refs/heads/main/apis.yml
name: Moneyhub
kind: company
description: >-
  Moneyhub is a UK open banking and open finance platform, headquartered in
  London with offices in Bristol and Ljubljana, that lets banks, pension
  providers, wealth managers, insurers and fintechs embed account aggregation,
  transaction data enrichment, financial insight and account-to-account payment
  initiation into their own products. Regulated by the FCA as an Account
  Information Service Provider (AISP), Payment Initiation Service Provider (PISP)
  and Credit Information Services Provider (CISP), Moneyhub ships a genuinely
  API-first surface: a RESTful, Swagger/OpenAPI-documented Data & Intelligence
  API for AIS aggregation, enrichment and affordability, and an Open Banking
  Payments API that initiates instant Faster Payments over the UK's Open Banking
  rails as a cheaper alternative to cards and direct debits. Authentication and
  payment consent run entirely through an OpenID Connect / OAuth2 identity layer
  at identity.moneyhub.co.uk, with client-credentials, authorization-code and
  jwt-bearer grants and fine-grained scopes for data and payment initiation.
