components:
  schemas:
    Links:
      additionalProperties: false
      properties:
        next:
          description: The url to retrieve the next page of results from
          format: uri
          type: string
        prev:
          description: The url to retrieve the previous page of results from
          format: uri
          type: string
        self:
          description: The url of the current resource(s)
          format: uri
          type: string
      required:
      - self
      type: object
    Affordability:
      additionalProperties: false
      type: object
      properties:
        createdAt:
          description: The timestamp at which the report was generated
          type: string
        id:
          description: The report id
          type: string
        income:
          type: object
          properties:
            amountConsistency:
              description: Consistency of monthly income, as a number between 0 and 1
              type: number
            longevity:
              type: object
              properties:
                consecutiveIncomeMonths:
                  description: Longevity of income detected in number of months
                  type: number
                incomePeriodLengthMonths:
                  description: The number of months of transaction history available for the income detection process
                  type: number
            predicted:
              description: The predicted monthly income amount
              additionalProperties: false
              type: object
              properties:
                value:
                  description: The amount in minor units of the currency, eg. pennies for GBP, negative means money going out of an account, positive means money coming into an account.
                  example: -2323
                  type: integer
                majorUnits:
                  description: The positive major units of the value, based on the values currency, eg. pounds for GBP.
                  example: 23
                  type: integer
                minorUnits:
                  description: The positive minor units of the value, based on the values currency, eg. pennies for GBP.
                  example: 23
                  type: integer
                currency:
                  description: The currency of the amount
                  example: GBP
                  type: string
              required:
              - value
              - currency
            regularIncomeDetected:
              description: Whether or not regular income was detected
              type: boolean
          required:
          - amountConsistency
          - longevity
          - predicted
          - regularIncomeDetected
        overdraftUseByAccount:
          type: array
          items:
            type: object
            properties:
              id:
                description: The account id
                type: string
              daysInOverdraft:
                description: The total number of days the account was overdrawn according to the account balance
                type: number
              daysInUnarrangedOverdraft:
                description: The total number of days the account was in unarranged overdraft according to the account balance. If we were not provided with an overdraft limit by the account provider, we assume any negative balance is unarranged overdraft
                type: number
              earliestBalanceDate:
                description: The earliest available balance date for the account
                type: string
              details:
                type: array
                items:
                  type: object
                  properties:
                    days:
                      description: The number of days the account was overdrawn during the period
                      type: number
                    start:
                      description: The start date of the period
                      type: string
                    end:
                      description: The end date of the period
                      type: string
                    minimumBalance:
                      description: The minimum balance of the account during the period
                      additionalProperties: false
                      type: object
                      properties:
                        value:
                          description: The amount in minor units of the currency, eg. pennies for GBP, negative means money going out of an account, positive means money coming into an account.
                          example: -2323
                          type: integer
                        majorUnits:
                          description: The positive major units of the value, based on the values currency, eg. pounds for GBP.
                          example: 23
                          type: integer
                        minorUnits:
                          description: The positive minor units of the value, based on the values currency, eg. pennies for GBP.
                          example: 23
                          type: integer
                        currency:
                          description: The currency of the amount
                          example: GBP
                          type: string
                      required:
                      - value
                      - currency
                    unarrangedOverdraft:
                      type: object
                      properties:
                        days:
                          description: The total number of days the account was in unarranged overdraft according to the account balance during the period
                          type: number
                        details:
                          type: array
                          items:
                            type: object
                            properties:
                              days:
                                description: The number of days the account was in unarranged overdraft during the unarranged overdraft period
                                type: number
                              start:
                                description: The start date of the unarranged overdraft period
                                type: string
                              end:
                                description: The end date of the unarranged overdraft period
                                type: string
                              minimumBalance:
                                description: The minimum balance of the account during the unarranged overdraft period
                                additionalProperties: false
                                type: object
                                properties:
                                  value:
                                    description: The amount in minor units of the currency, eg. pennies for GBP, negative means money going out of an account, positive means money coming into an account.
                                    example: -2323
                                    type: integer
                                  majorUnits:
                                    description: The positive major units of the value, based on the values currency, eg. pounds for GBP.
                                    example: 23
                                    type: integer
                                  minorUnits:
                                    description: The positive minor units of the value, based on the values currency, eg. pennies for GBP.
                                    example: 23
                                    type: integer
                                  currency:
                                    description: The currency of the amount
                                    example: GBP
                                    type: string
                                required:
                                - value
                                - currency
                            required:
                            - days
                            - start
                            - end
                            - minimumBalance
                      required:
                      - days
                      - details
                  required:
                  - days
                  - end
                  - minimumBalance
                  - start
            required:
            - id
            - daysInOverdraft
            - earliestBalanceDate
        overview:
          type: object
          properties:
            discretionaryExpenses:
              description: The median monthly discretionary spend
              additionalProperties: false
              type: object
              properties:
                value:
                  description: The amount in minor units of the currency, eg. pennies for GBP, negative means money going out of an account, positive means money coming into an account.
                  example: -2323
                  type: integer
                majorUnits:
                  description: The positive major units of the value, based on the values currency, eg. pounds for GBP.
                  example: 23
                  type: integer
                minorUnits:
                  description: The positive minor units of the value, based on the values currency, eg. pennies for GBP.
                  example: 23
                  type: integer
                currency:
                  description: The currency of the amount
                  example: GBP
                  type: string
              required:
              - value
              - currency
            fixedExpenses:
              description: The median monthly fixed spend
              additionalProperties: false
              type: object
              properties:
                value:
                  description: The amount in minor units of the currency, eg. pennies for GBP, negative means money going out of an account, positive means money coming into an account.
                  example: -2323
                  type: integer
                majorUnits:
                  description: The positive major units of the value, based on the values currency, eg. pounds for GBP.
                  example: 23
                  type: integer
                minorUnits:
                  description: The positive minor units of the value, based on the values currency, eg. pennies for GBP.
                  example: 23
                  type: integer
                currency:
                  description: The currency of the amount
                  example: GBP
                  type: string
              required:
              - value
              - currency
            flexibleExpenses:
              description: The median monthly flexible spend
              additionalProperties: false
              type: object
              properties:
                value:
                  description: The amount in minor units of the currency, eg. pennies for GBP, negative means money going out of an account, positive means money coming into an account.
                  example: -2323
                  type: integer
                majorUnits:
                  description: The positive major units of the value, based on the values currency, eg. pounds for GBP.
                  example: 23
                  type: integer
                minorUnits:
                  description: The positive minor units of the value, based on the values currency, eg. pennies for GBP.
                  example: 23
                  type: integer
                currency:
                  description: The currency of the amount
                  example: GBP
                  type: string
              required:
              - value
              - currency
            income:
              description: The median monthly income
              additionalProperties: false
              type: object
              properties:
                value:
                  description: The amount in minor units of the currency, eg. pennies for GBP, negative means money going out of an account, positive means money coming into an account.
                  example: -2323
                  type: integer
                majorUnits:
                  description: The positive major units of the value, based on the values currency, eg. pounds for GBP.
                  example: 23
                  type: integer
                minorUnits:
                  description: The positive minor units of the value, based on the values currency, eg. pennies for GBP.
                  example: 23
                  type: integer
                currency:
                  description: The currency of the amount
                  example: GBP
                  type: string
              required:
              - value
              - currency
            incomeIncludingTransfers:
              description: The median monthly income including incoming transfers when incoming transfers exceed outgoing transfers
              additionalProperties: false
              type: object
              properties:
                value:
                  description: The amount in minor units of the currency, eg. pennies for GBP, negative means money going out of an account, positive means money coming into an account.
                  example: -2323
                  type: integer
                majorUnits:
                  description: The positive major units of the value, based on the values currency, eg. pounds for GBP.
                  example: 23
                  type: integer
                minorUnits:
                  description: The positive minor units of the value, based on the values currency, eg. pennies for GBP.
                  example: 23
                  type: integer
                currency:
                  description: The currency of the amount
                  example: GBP
                  type: string
              required:
              - value
              - currency
            nonDiscretionaryExpenses:
              description: The median monthly non-discretionary spend
              additionalProperties: false
              type: object
              properties:
                value:
                  description: The amount in minor units of the currency, eg. pennies for GBP, negative means money going out of an account, positive means money coming into an account.
                  example: -2323
                  type: integer
                majorUnits:
                  description: The positive major units of the value, based on the values currency, eg. pounds for GBP.
                  example: 23
                  type: integer
                minorUnits:
                  description: The positive minor units of the value, based on the values currency, eg. pennies for GBP.
                  example: 23
                  type: integer
                currency:
                  description: The currency of the amount
                  example: GBP
                  type: string
              required:
              - value
              - currency
          required:
          - discretionaryExpenses
          - fixedExpenses
          - flexibleExpenses
          - income
          - nonDiscretionaryExpenses
        primaryIncomeAccountId:
          description: The account id of the detected primary income account
          type: string
        riskIndicators:
          type: object
          properties:
            cashWithdrawals:
              description: The median monthly cash withdrawal amount
              additionalProperties: false
              type: object
              properties:
                value:
                  description: The amount in minor units of the currency, eg. pennies for GBP, negative means money going out of an account, positive means money coming into an account.
                  example: -2323
                  type: integer
                majorUnits:
                  description: The positive major units of the value, based on the values currency, eg. pounds for GBP.
                  example: 23
                  type: integer
                minorUnits:
                  description: The positive minor units of the value, based on the values currency, eg. pennies for GBP.
                  example: 23
