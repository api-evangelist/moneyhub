                                      example: -2323
                                      type: integer
                                    majorUnits:
                                      description: The positive major units of the value, based on the values currency, eg. pounds for GBP.
                                      example: 23
                                      type: integer
                                    minorUnits:
                                      description: The positive minor units of the value, based on the values currency, eg. pennies for GBP.
                                      example: 23
