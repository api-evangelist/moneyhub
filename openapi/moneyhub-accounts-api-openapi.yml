          - InterimCleared
          - OpeningAvailable
          - OpeningBooked
          - OpeningCleared
          - PreviouslyClosedBooked
      example:
        date: '2018-08-12'
        amount:
          value: 300023
          majorUnits: 3000
          minorUnits: 23
          currency: GBP
        type: InterimAvailable
      required:
      - amount
      - date
    AccountSync:
      additionalProperties: false
      type: object
      properties:
        accountId:
          description: The unique identity of the account.
          example: ac9bd177-d01e-449c-9f29-d3656d2edc2e
          type: string
        lastSuccessfulSync:
          description: The date at which the account was last synchronised successfully with the provider
          example: '2018-07-10T11:39:44.000Z'
          format: date-time
          type:
          - string
          - 'null'
      required:
      - accountId
      - lastSuccessfulSync
    BalancePost:
      additionalProperties: false
      type: object
      properties:
        amount:
          properties:
            value:
              description: The value of the balance in minor units of the currency, eg. pennies for GBP.
              example: 300023
              type: integer
          required:
          - value
          type: object
        date:
          description: The date of the balance
          example: '2018-08-12'
          format: date
          type: string
      example:
        date: '2018-08-12'
        amount:
          value: 300023
      required:
      - amount
      - date
    Error:
      additionalProperties: false
      properties:
        code:
          description: The error code
          type: string
        message:
          description: The error message
          type: string
        correlationId:
          description: Id that identifies the request and can be used to ask for more details related to the error
          type: string
        id:
          description: Id of the resource
          type: string
        userId:
          description: UserId of the resource
          type: string
      required:
      - code
      type: object
    AccountPatch:
      properties:
        accountName:
          description: The name of the account
          example: Account name
          type: string
        providerName:
          description: The name of the provider of the account.
          example: Provider name
          type: string
        details:
          additionalProperties: false
          type: object
          properties:
            AER:
              description: For cash and savings accounts. Interest rate expressed as a percentage 'Annual Equivalent Rate'.
              example: 1.3
              type: number
              minimum: 0
              maximum: 100
            APR:
              description: For credit cards, mortgages and loans. Interest rate expressed as a percentage 'Annual Percentage Rate'.
              example: 13.1
              type: number
              minimum: 0
              maximum: 100
            creditLimit:
              description: For credit cards. The agreed overdraft limit of the account in minor units of the currency.
              example: 150000
              minimum: 0
              type: integer
            endDate:
              description: For Mortgages and loans. The date at which the loan/mortgage will finish.
              format: date
              example: '2020-01-01'
              type: string
            fixedDate:
              description: For Mortgages. The date at which the current fixed rate ends
              format: date
              example: '2019-01-01'
              type: string
            interestFreePeriod:
              type: integer
              description: For loans. The length in months of the interest free period
              example: 12
              minimum: 0
            interestType:
              description: For mortgages. The interest type
              enum:
              - fixed
              - variable
              example: fixed
              type: string
            linkedProperty:
              type: string
              description: For Mortgages. The id of an associated property account
              example: ac9bd177-d01e-449c-9f29-d3656d2edc2e
            monthlyRepayment:
              type: integer
              description: For mortgages and loans. The monthly amount due to the mortgage provider in minor units of the currency.
              example: 60000
              minimum: 0
            overdraftLimit:
              description: For cash accounts. The agreed overdraft limit of the account in minor units of the currency.
              example: 150000
              type: integer
              minimum: 0
            postcode:
              description: For properties. The postcode of the property
              example: bs1 1aa
              type: string
            runningCost:
              description: For assets. The running cost in minor units of the currency.
              example: 20000
              type: integer
              minimum: 0
            runningCostPeriod:
              type: string
              description: For assets. The running cost period
              enum:
              - month
              - year
              example: month
            term:
              type: integer
              description: For mortgages. The term of the mortgage in months.
              example: 13
              minimum: 0
            yearlyAppreciation:
              type: number
              description: For assets. The rate of appreciation as a percentage, negative values indicate that the asset will depreciate
              example: -10
      required:
      - accountName
      - providerName
      type: object
  securitySchemes:
    Bearer:
      type: apiKey
      name: Authorization
      in: header
